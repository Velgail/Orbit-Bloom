<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="description" content="シンプルな図形たちが夜空で踊る、やさしめサバイバルシューティング">
    <title>Orbit-Bloom</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="gameInfo">
        <div id="topLeft">
            <div class="ui-label">SCORE</div>
            <div class="ui-value" id="score">0</div>
        </div>
        <div id="topCenter">
            <div class="ui-label">TIME</div>
            <div class="ui-value" id="time">60</div>
        </div>
        <div id="topRight">
            <div class="ui-label">LIVES</div>
            <div class="ui-value" id="lives">3</div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
